spring:
  application:
    name: gems-platform-server
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  profiles:
    default: dev

server:
  port: 8080

scaffold:
  api-prefix: /api
  documents:
    storage-path: ${DOCUMENT_STORAGE_PATH:./data/documents}
  selection:
    storage-path: ${SELECTION_STORAGE_PATH:./data/selection}
    max-template-size: 20971520
  jwt:
    expires-seconds: 7200

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
