# Production is selected explicitly by the service command line.
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18082}
spring:
  sql:
    init:
      mode: never
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
scaffold:
  migrations:
    enabled: false
  jwt:
    secret: ${JWT_SECRET}
  documents:
    storage-path: ${DOCUMENT_STORAGE_PATH:/home/glory/workmobile/selectproject/data/documents}
  selection:
    storage-path: ${SELECTION_STORAGE_PATH:/home/glory/workmobile/selectproject/data/selection}
    bootstrap-template-path: ${SELECTION_BOOTSTRAP_TEMPLATE_PATH:/home/glory/workmobile/selectproject/data/selection/templates/standard.pptx}
  initiation:
    storage-path: ${INITIATION_STORAGE_PATH:/home/glory/workmobile/selectproject/data/initiation}
    bootstrap-template-path: ${INITIATION_BOOTSTRAP_TEMPLATE_PATH:/home/glory/workmobile/selectproject/data/initiation/templates/standard.pptx}
