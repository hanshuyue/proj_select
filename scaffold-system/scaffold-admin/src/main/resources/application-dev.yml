spring:
  main:
    banner-mode: console
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/scaffold_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DEV_DB_PASSWORD:}
  data:
    redis:
      host: localhost
      port: 6379
     # password: password

logging:
  level:
    root: info
    com.scaffold: info

flowable:
  database-schema-update: false
  use-lock-for-database-schema-update: false
  async-executor-activate: false
  process:
    definition-cache-limit: 128
  auto-deployment-enabled: false
  rest-api-enabled: false

scaffold:
  jwt:
    secret: ${DEV_JWT_SECRET:development-only-jwt-key-not-for-production-2026}
  initiation:
    storage-path: ./data/initiation
    # The standard deck (including its embedded financial workbook) ships with the application.
    # Fillers never need to upload the PPTX or the yield-calculation Excel separately.
    bootstrap-template-path: ${INITIATION_BOOTSTRAP_TEMPLATE_PATH:../../deploy/templates/initiation/standard.pptx}
  selection:
    bootstrap-template-path: ${SELECTION_BOOTSTRAP_TEMPLATE_PATH:../../deploy/templates/selection/standard.pptx}
